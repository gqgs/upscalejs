name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lib
      - name: Verify backend assets are packaged
        run: |
          test -f dist/js/ort-wasm-simd-threaded.wasm
          find dist/js -name 'ort-wasm-simd-threaded.*.wasm' | grep -q .
